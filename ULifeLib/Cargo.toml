[package]
name = "ulife_lib"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["staticlib", "lib"]
name = "ulife_lib"

[dependencies]
bytes = "1.11.0"
blake3 = "1.5.5"
moka = { version = "0.12.11", features = ["future"] }
once_cell = "1.21.3"
prost = "0.14.1"
prost-types = "0.14.1"
reqwest = { version = "0.12.24", features = ["multipart"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs"] }
uniffi = {version = "0.30.0", features = ["tokio"] }
dashmap = "6.1.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.132"
chrono = "0.4.42"
async-trait = "0.1"
foyer = "0.21.0"

[build-dependencies]
prost-build = "0.14.1"
walkdir = "2.5.0"
